<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firmic — Interactive Demo</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body { background:#0b0f17; }
  </style>
</head>

<body class="text-white font-sans">

<!-- HERO -->
<section class="max-w-6xl mx-auto px-10 py-20 grid md:grid-cols-2 gap-10">

  <div>
    <h1 class="text-5xl font-bold leading-tight">
      Build and operate real companies instantly.
    </h1>

    <p class="text-gray-400 mt-4">
      Try the live system below — create a company in real time.
    </p>

    <div class="mt-6 flex gap-3">
      <button onclick="scrollToDemo()" class="px-6 py-3 bg-white text-black rounded-xl">
        Try Live Demo
      </button>
    </div>
  </div>

  <!-- LIVE DASHBOARD -->
  <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6">

    <div class="flex justify-between">
      <div>
        <p class="text-sm text-gray-400">Company</p>
        <p id="companyName" class="text-lg font-bold">—</p>
      </div>

      <span id="status" class="text-xs px-3 py-1 rounded-full bg-gray-700">
        Idle
      </span>
    </div>

    <div class="mt-6 space-y-2 text-sm text-gray-300">
      <div>Formation: <span id="s1">—</span></div>
      <div>Setup: <span id="s2">—</span></div>
      <div>Activation: <span id="s3">—</span></div>
    </div>

    <div class="mt-6 p-3 bg-black/40 rounded-lg text-sm text-gray-400">
      Sonny: <span id="sonny">Waiting for input...</span>
    </div>

  </div>

</section>

<!-- DEMO SECTION -->
<section id="demo" class="max-w-4xl mx-auto px-10 py-20">

  <h2 class="text-3xl font-bold mb-6">Live Company Creation</h2>

  <input id="inputName"
    class="w-full p-3 rounded-lg bg-gray-900 border border-gray-700"
    placeholder="Enter company name..."
  />

  <button onclick="createCompany()"
    class="mt-4 px-6 py-3 bg-white text-black rounded-xl">
    Create Company
  </button>

</section>

<!-- SONNY DEMO -->
<section class="max-w-4xl mx-auto px-10 py-10">

  <h2 class="text-2xl font-bold mb-4">Sonny AI Demo</h2>

  <input id="question"
    class="w-full p-3 rounded-lg bg-gray-900 border border-gray-700"
    placeholder="Ask Sonny about your company..."
  />

  <button onclick="askSonny()"
    class="mt-3 px-6 py-3 bg-white text-black rounded-xl">
    Ask
  </button>

  <p id="answer" class="mt-4 text-gray-400"></p>

</section>

<!-- PRICING -->
<section class="max-w-6xl mx-auto px-10 py-20 grid md:grid-cols-3 gap-6">

  <div class="border border-gray-800 p-6 rounded-xl">
    Starter $49
    <button onclick="selectPlan('starter')" class="mt-4 w-full bg-gray-800 py-2 rounded">
      Select
    </button>
  </div>

  <div class="border border-gray-600 p-6 rounded-xl bg-white text-black">
    Business $99
    <button onclick="selectPlan('business')" class="mt-4 w-full bg-black text-white py-2 rounded">
      Select
    </button>
  </div>

  <div class="border border-gray-800 p-6 rounded-xl">
    Growth $199
    <button onclick="selectPlan('growth')" class="mt-4 w-full bg-gray-800 py-2 rounded">
      Select
    </button>
  </div>

</section>

<!-- SCRIPT -->
<script>

function scrollToDemo(){
  document.getElementById("demo").scrollIntoView({behavior:"smooth"});
}

function createCompany(){
  const name = document.getElementById("inputName").value;

  document.getElementById("companyName").innerText = name;
  document.getElementById("status").innerText = "Processing";

  document.getElementById("s1").innerText = "✔";
  document.getElementById("sonny").innerText = "Initializing company system...";

  setTimeout(() => {
    document.getElementById("s2").innerText = "✔";
    document.getElementById("sonny").innerText = "Setting up business infrastructure...";
  }, 1500);

  setTimeout(() => {
    document.getElementById("s3").innerText = "✔";
    document.getElementById("status").innerText = "Active";
    document.getElementById("sonny").innerText = "Your company is now operational.";
  }, 3000);
}

function askSonny(){
  const q = document.getElementById("question").value;
  const a = document.getElementById("answer");

  if(q.toLowerCase().includes("status")){
    a.innerText = "Your company is currently active and fully operational.";
  } else if(q.toLowerCase().includes("what")){
    a.innerText = "Firmic manages your company lifecycle from creation to operation.";
  } else {
    a.innerText = "Sonny is analyzing your request...";
  }
}

function selectPlan(plan){
  alert("Selected plan: " + plan + " (connect Stripe later)");
}

</script>

</body>
</html>
